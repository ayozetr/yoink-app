[package]
name = "yoink-desktop"
version = "5.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Yoink native desktop UI (egui) — talks to the local yoink-core backend"
homepage = "https://github.com/ayozetr/yoink-app"
repository = "https://github.com/ayozetr/yoink-app"

[[bin]]
name = "yoink-desktop"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
notify-rust = "4.11.3"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
# Detect the OS light/dark preference (winit's system_theme is unreliable on
# Wayland); used to resolve the "System" theme. Reads the XDG desktop portal.
dark-light = "3.0.0"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
minisign-verify = "0.2"
base64 = "0.23"
discord-rich-presence = "1.1.0"
timeago = "0.6.1"
isolang = "2.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = "0.19.2"
gtk = "0.18.1"
glib = "0.18.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.169"

[target.'cfg(target_os = "windows")'.dependencies]
# Round the borderless window's corners via DWM (Windows doesn't honor the
# transparent-framebuffer rounding the way a Wayland compositor does).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",         # SetCurrentProcessExplicitAppUserModelID (toast identity)
    "Win32_System_Pipes",     # single-instance deep-link handoff (named pipe)
    "Win32_Storage_FileSystem",
    "Win32_System_IO",        # OVERLAPPED (param of ReadFile/WriteFile/ConnectNamedPipe)
    "Win32_Security",         # SECURITY_ATTRIBUTES (param of CreateFileW/CreateNamedPipeW)
] }

[build-dependencies]
# Embeds the app icon into the Windows .exe (see build.rs); harmless elsewhere.
winresource = "0.1.17"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

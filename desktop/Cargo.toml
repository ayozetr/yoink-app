[package]
name = "yoink-desktop"
version = "4.4.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Yoink native desktop UI (egui) — talks to the local yoink-core backend"

[[bin]]
name = "yoink-desktop"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.24.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
notify-rust = "4.11.3"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
# Detect the OS light/dark preference (winit's system_theme is unreliable on
# Wayland); used to resolve the "System" theme. Reads the XDG desktop portal.
dark-light = "1.1.1"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
minisign-verify = "0.2"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = "0.19.2"
gtk = "0.18.1"
glib = "0.18.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.169"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

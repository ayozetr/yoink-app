[package]
name = "yoink-core"
version = "4.4.0"
edition = "2021"
description = "Rust core for Yoink — orchestrates the yt-dlp and ffmpeg binaries (replaces the Python backend)."
license = "AGPL-3.0-or-later"

[[bin]]
name = "yoink-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "process", "net", "io-util"] }
axum = { version = "0.7.9", features = ["ws"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
tower-http = { version = "0.6.2", features = ["cors"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
difflib = "0.4.0"
unicode-normalization = "0.1.24"
regex = "1.11.1"

[profile.release]
strip = true

name: Release

# Builds the native egui desktop app as a signed AppImage and assembles the
# updater manifest.
#
#   Push a tag v<ver> (after bumping the version)  -> build + draft release
#   Run manually (workflow_dispatch)               -> build only, artifacts, no release
#
# The app ships the native Rust backend (yoink-core), the pinned standalone yt-dlp
# and a minimal self-built ffmpeg/ffprobe, all packed into one AppImage (no WebKit,
# so it's far smaller than the old Tauri bundle). The in-place updater verifies a
# minisign signature made with the key in two repo secrets (never in the repo):
#   TAURI_SIGNING_PRIVATE_KEY           the minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The same key the legacy app used, so one signed AppImage serves both the one-time
# legacy→egui migration and the egui app's own updater. Fork PRs never get the secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (cargo build + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Backend (build + test)
        working-directory: backend-rs
        run: cargo build --release --locked && cargo test --locked
      - name: Desktop (clippy + test)
        working-directory: desktop
        run: cargo clippy --release --locked -- -D warnings && cargo test --release --locked

  build-linux:
    name: Build Linux AppImage
    needs: test
    runs-on: ubuntu-22.04 # oldest supported glibc for a portable AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rs -> target\ndesktop -> target"
      # The minisign signer (reads the same Tauri key format); prebuilt, no compile.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev \
            patchelf file xz-utils nasm cmake pkg-config

      - name: Build minimal ffmpeg + ffprobe
        run: bash scripts/build_ffmpeg.sh

      - name: Build the egui AppImage (yoink-desktop + yoink-core + yt-dlp + ffmpeg)
        run: bash scripts/build_egui_appimage.sh

      - name: Sign the AppImage (minisign, legacy-compatible key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign desktop/target/appimage/Yoink_*_amd64.AppImage

      - name: Assemble latest.json
        run: python scripts/make_latest_json_egui.py desktop/target/appimage

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp desktop/target/appimage/Yoink_*_amd64.AppImage out/
          cp desktop/target/appimage/Yoink_*_amd64.AppImage.sig out/
          cp desktop/target/appimage/latest.json out/
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend-rs -> target\ndesktop -> target"
      # The minisign signer (same Tauri key format), prebuilt; and NSIS for the
      # installer. The egui app + yoink-core already compile clean on windows-msvc.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build the Windows package (yoink-desktop + yoink-core + yt-dlp + ffmpeg, NSIS)
        run: python scripts/build_windows.py

      - name: Sign the installer (minisign, legacy-compatible key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/target/windows/Yoink_*_x64-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          cargo tauri signer sign $exe.FullName

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item desktop/target/windows/Yoink_*_x64-setup.exe out/
          Copy-Item desktop/target/windows/Yoink_*_x64-setup.exe.sig out/
          Get-ChildItem out/

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      # Rebuild latest.json from BOTH signed assets (the linux artifact carries a
      # linux-only one from its own job; this overwrites it with both platforms).
      - name: Assemble latest.json (linux + windows)
        run: python scripts/make_latest_json_egui.py dist
      - run: ls -la dist/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Yoink ${GITHUB_REF_NAME}" \
            --notes "Draft release built by CI. Add the release notes (keep the \`<!-- /whatsnew -->\` marker), then publish — publishing makes latest.json live for the in-app updater and the legacy→egui migration (Linux AppImage + Windows installer)." \
            dist/Yoink_*_amd64.AppImage \
            dist/Yoink_*_x64-setup.exe \
            dist/latest.json
          echo "::notice::Draft release created for ${GITHUB_REF_NAME} — add notes and publish."

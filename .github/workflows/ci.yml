name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, egui-ui]
  pull_request:
    branches: [main, egui-ui]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (fmt · clippy · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - name: Format check
        working-directory: backend-rs
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        working-directory: backend-rs
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build + test
        working-directory: backend-rs
        run: |
          cargo build --release --locked
          cargo test --locked

  desktop:
    name: Desktop (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop\ndesktop-minter"
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Format check
        working-directory: desktop
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        working-directory: desktop
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: desktop
        run: cargo test --locked

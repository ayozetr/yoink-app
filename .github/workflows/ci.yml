name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, rust-core]
  pull_request:
    branches: [main, rust-core]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · build · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

  backend:
    name: Backend (fmt · clippy · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - name: Format check
        working-directory: backend-rs
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        working-directory: backend-rs
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build + test
        working-directory: backend-rs
        run: |
          cargo build --release --locked
          cargo test --locked

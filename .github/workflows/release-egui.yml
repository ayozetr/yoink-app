name: Release (egui)

# Builds the native egui desktop app as a signed AppImage and assembles the
# updater manifest. Kept separate from the Tauri `release.yml` until it's proven;
# once it is, this replaces it (and the Tauri bundle is dropped).
#
#   Run manually (workflow_dispatch)  -> build the AppImage + latest.json, upload
#                                        as artifacts (does NOT publish a release)
#
# Signing reuses the SAME minisign key the legacy updater uses, so one signed
# AppImage is accepted by both the old Tauri app (for the one-time migration) and
# the egui app's own updater:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/yoink.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
on:
  workflow_dispatch:
  # Temporary: build on every push to egui-ui so the packaging can be iterated on
  # CI before this replaces release.yml. Remove once validated.
  push:
    branches: [egui-ui]
    paths:
      - "desktop/**"
      - "backend-rs/**"
      - "scripts/build_egui_appimage.sh"
      - "scripts/make_latest_json_egui.py"
      - ".github/workflows/release-egui.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (cargo build + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Backend (build + test)
        working-directory: backend-rs
        run: cargo build --release --locked && cargo test --locked
      - name: Desktop (clippy + test)
        working-directory: desktop
        run: cargo clippy --release --locked -- -D warnings && cargo test --release --locked

  build-linux:
    name: Build Linux AppImage
    needs: test
    runs-on: ubuntu-22.04 # oldest supported glibc for a portable AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nbackend-rs -> target\ndesktop -> target"

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf file xz-utils nasm cmake pkg-config

      - name: npm install (for the Tauri signer only)
        run: npm ci

      - name: Build minimal ffmpeg + ffprobe
        run: bash scripts/build_ffmpeg.sh

      - name: Build the egui AppImage (yoink-desktop + yoink-core + yt-dlp + ffmpeg)
        run: bash scripts/build_egui_appimage.sh

      - name: Sign the AppImage (minisign, legacy-compatible key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign desktop/target/appimage/Yoink_*_amd64.AppImage

      - name: Assemble latest.json (Linux)
        run: python scripts/make_latest_json_egui.py desktop/target/appimage

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp desktop/target/appimage/Yoink_*_amd64.AppImage out/
          cp desktop/target/appimage/Yoink_*_amd64.AppImage.sig out/
          cp desktop/target/appimage/latest.json out/
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: egui-linux
          path: out/
          if-no-files-found: error

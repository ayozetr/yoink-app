version: 2

# Dependabot only opens PRs on their own branches; nothing merges without review.
# The three Rust crates are independent (each has its own Cargo.lock), so each is
# scanned on its own. yt-dlp stays owner-managed (pinned in scripts/, not a cargo
# dependency), bumped by hand. The browser extension has no package manifest
# (vanilla JS, no dependencies), so there is nothing to scan there.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/backend-rs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/desktop-minter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

version: 2

# Dependabot only opens PRs on their own branches; nothing merges without review.
# yt-dlp stays owner-managed (pinned in scripts/ytdlp-version.txt), bumped by hand.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/desktop"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/backend-rs"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/desktop-minter"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
